:root{
  font-size:calc(100vw / 216);
  --bg:#17110C; --ink:#F4EFE6; --mute:rgba(244,239,230,.62); --hot:#C8321E;
  --accent:#F0B429;
}
:root[data-season="winter"]{--bg:#0B1A1C; --accent:#9FD8E0}
:root[data-season="spring"]{--bg:#121A10; --accent:#B8E07A}
:root[data-season="summer"]{--bg:#1A0F12; --accent:#FF8A5B}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{position:relative;height:100vh;display:flex;flex-direction:column;font-family:"Newsreader",Georgia,serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:.6rem solid var(--accent);outline-offset:.4rem}
.disp{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;
  text-transform:uppercase;line-height:.86}

/* Scene image across the top, fading into the page */
.scene{position:absolute;inset:0 0 auto 0;height:205rem;overflow:hidden;background:#000}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .9s ease}
.scene img.on{opacity:1}
.scene::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 48%,var(--bg) 100%)}

.top{position:relative;flex:none;padding:6rem 9rem 0;display:flex;justify-content:space-between;
  align-items:baseline;z-index:2;text-shadow:0 .3rem 1.5rem rgba(0,0,0,.6)}
.top h1{font-size:9.5rem;letter-spacing:.01em}
.top p{font-size:4.4rem;font-style:italic}

/* Featured movie */
.feature{position:relative;flex:1 1 auto;min-height:0;padding:4rem 9rem 4rem;z-index:2;
  display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
  column-gap:7rem;width:100%;transition:opacity .35s ease}
.feature.swap{opacity:0}
.poster{height:100%;max-height:132rem;aspect-ratio:2/3;align-self:end;background:#000;overflow:hidden;
  box-shadow:0 3rem 8rem rgba(0,0,0,.6);outline:.3rem solid rgba(255,255,255,.12)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .noart{display:flex;align-items:flex-end;height:100%;padding:4rem;font-size:10rem;color:var(--accent);overflow-wrap:anywhere}
.when{align-self:end;padding-bottom:1rem;min-width:0}
.when .lead{font-size:6rem;font-style:italic;color:var(--mute)}
.when .big{font-size:36rem;color:var(--accent);margin-top:1rem;white-space:nowrap;letter-spacing:-.01em}
.when .big small{font-size:.38em;margin-left:1.5rem;letter-spacing:0}
.when .date{font-size:6.4rem;font-weight:600;margin-top:2.5rem}
.words{grid-column:1 / -1;padding-top:5rem;min-width:0}
.title{font-size:24rem;overflow-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem 4rem;margin-top:4rem;font-size:5rem;color:var(--mute)}
.rating{display:inline-block;border:.5rem solid var(--ink);color:var(--ink);padding:1rem 2.2rem .6rem;font-size:6rem;line-height:1}
.rating.r{background:var(--hot);border-color:var(--hot);color:#fff}
.rating.nr{font-size:4.2rem;padding:1.4rem 2.2rem 1rem;border-color:var(--mute);color:var(--mute)}
.blurb{font-size:5.6rem;line-height:1.38;margin-top:4rem;max-width:62ch;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:4.6rem;margin-top:3.5rem;font-style:italic;color:var(--mute);margin-top:2.5rem}

/* Next up rail */
.rail{position:relative;flex:none;padding:3rem 9rem 2rem;z-index:2;
  background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.35))}
.rail h2{font-size:6rem;color:var(--mute);margin-bottom:2.6rem;letter-spacing:.02em}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2.4rem}
.pick{position:relative;min-width:0}
.pick .art{display:block;width:100%;aspect-ratio:2/3;background:#000;overflow:hidden;opacity:.55;
  transition:opacity .3s ease, transform .3s ease}
.pick .art img{width:100%;height:100%;object-fit:cover;display:block}
.pick .art .noart{display:flex;align-items:flex-end;height:100%;padding:1.6rem;font-size:3.6rem;color:var(--accent);overflow-wrap:anywhere}
.pick .d{display:block;font-family:"Big Shoulders Display",sans-serif;font-weight:800;text-transform:uppercase;
  font-size:5rem;margin-top:1.8rem;color:var(--mute)}
.pick i{position:absolute;left:0;bottom:7.6rem;height:.6rem;width:0;background:var(--accent)}
.pick[aria-current="true"] .art{opacity:1;transform:translateY(-1.2rem)}
.pick[aria-current="true"] .d{color:var(--accent)}
.pick[aria-current="true"] i.run{width:100%;transition:width var(--rot) linear}

.foot{position:relative;flex:none;padding:0 9rem 2.4rem;z-index:2;display:flex;justify-content:space-between;
  font-size:2.4rem;color:rgba(244,239,230,.4)}

/* Setup and error message */
.note{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 12rem;z-index:3;background:var(--bg)}
.note h2{font-size:20rem;color:var(--accent)}
.note p{font-size:5.4rem;line-height:1.4;margin-top:4rem;max-width:60ch}
.note code{font-family:ui-monospace,Consolas,monospace;font-size:4.2rem;background:var(--ink);color:var(--bg);padding:.4rem 1.2rem}

/* Detail sheet */
dialog{border:0;padding:0;max-width:none;max-height:none;width:100vw;height:100vh;background:rgba(0,0,0,.72);color:var(--ink)}
dialog::backdrop{background:transparent}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--bg);
  border-top:1.4rem solid var(--accent);padding:9rem 9rem 8rem}
.sheet h2{font-size:17rem;color:var(--accent)}
.sheet .line{font-size:5.2rem;margin-top:3.5rem;color:var(--mute)}
.sheet .full{font-size:5.6rem;line-height:1.42;margin-top:5rem;max-width:64ch}
.sheet dl{margin-top:5rem;font-size:4.8rem;line-height:1.4;display:grid;grid-template-columns:auto 1fr;gap:1.6rem 4rem}
.sheet dt{color:var(--mute);font-style:italic}
.close{margin-top:7rem;background:var(--ink);color:var(--bg);font-family:"Big Shoulders Display",sans-serif;
  font-weight:900;text-transform:uppercase;font-size:7rem;padding:2.6rem 7rem 2.2rem;line-height:1}

/* Landscape: scene fills the screen, text on the left */
@media (min-aspect-ratio:1/1){
  :root{font-size:calc(100vh / 216 * .62)}
  .scene{height:100%}
  .scene::after{background:linear-gradient(to right,var(--bg) 0,rgba(0,0,0,.55) 45%,rgba(0,0,0,.1) 75%),
    linear-gradient(to bottom,rgba(0,0,0,0) 55%,var(--bg) 100%)}
  .feature{max-width:200rem}
}
@media (prefers-reduced-motion:reduce){
  .feature,.scene img,.pick .art{transition:none}
  .pick[aria-current="true"] i.run{transition:none}
}
</style>
</head>

<div class="scene" id="scene"></div>

<header class="top">
  <h1 class="disp">Coming to theaters</h1>
  <p id="today"></p>

  <div class="words">

    <p class="more">Tap the poster for the story and cast</p>
  </div>
</button>

<section class="rail" id="board" hidden>
  <h2 class="disp">Next up</h2>
  <div class="strip" id="rows"></div>
</section>

<footer class="foot">

    <button class="close" id="s-close" type="button">Close</button>

  "use strict";

  // ---------- Settings (all can be set in the page address) ----------
  // ?key=YOUR_TMDB_KEY   required for live data (v3 API key or v4 read token)
  // &days=75             how far ahead to look
  // &max=8               how many films to list
  // &maxrating=R         highest rating shown: G, PG, PG-13 or R
  // &hide=123,456        TMDB movie ids to leave out
  // &rotate=12           seconds each film is featured
  // &demo=1              sample layout with made-up titles, no network
  var q = new URLSearchParams(location.search);
  var CFG = {
    key: q.get("key") || "",
    days: num(q.get("days"), 75),
    max: Math.min(num(q.get("max"), 8), 8),
    maxRating: (q.get("maxrating") || "R").toUpperCase(),
    hide: (q.get("hide") || "").split(",").filter(Boolean).map(Number),
    rotate: Math.max(num(q.get("rotate"), 12), 5),
    demo: q.get("demo") === "1"
  };
  var RANK = { "G": 1, "PG": 2, "PG-13": 3, "R": 4, "NC-17": 5 };
  var API = "https://api.themoviedb.org/3";
  var IMG = "https://image.tmdb.org/t/p/w780";
  var BIG = "https://image.tmdb.org/t/p/original";
  var SMALL = "https://image.tmdb.org/t/p/w342";
  var REFRESH_MS = 6 * 60 * 60 * 1000;
  var PAUSE_MS = 30000;
  var CACHE_KEY = "out-soon-v2";

  var $ = function (id) { return document.getElementById(id); };
  var films = [], index = 0, timer = null, pausedUntil = 0, sheetTimer = null;

  function num(v, d) { var n = parseInt(v, 10); return isNaN(n) ? d : n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseDay(s) { var p = s.slice(0, 10).split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
  function fmt(d, o) { return d.toLocaleDateString("en-US", o); }

  // ---------- Season sets the color of the screen ----------
  (function () {
    var m = new Date().getMonth();
    var s = m >= 8 && m <= 10 ? "fall" : (m === 11 || m <= 1) ? "winter" : m <= 4 ? "spring" : "summer";
    document.documentElement.dataset.season = q.get("season") || s;
    document.documentElement.style.setProperty("--rot", CFG.rotate + "s");
    $("today").textContent = fmt(new Date(), { weekday: "long", month: "long", day: "numeric" });
  })();

  // ---------- Data ----------
  function get(path, params) {
    var url = new URL(API + path), opts = {};
    Object.keys(params || {}).forEach(function (k) { url.searchParams.set(k, params[k]); });
    if (CFG.key.length > 40) opts.headers = { Authorization: "Bearer " + CFG.key };
    else url.searchParams.set("api_key", CFG.key);
    return fetch(url, opts).then(function (r) {
      if (!r.ok) { var e = new Error("TMDB " + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }

  function loadLive() {
    var today = midnight(new Date());
    var end = new Date(today.getTime() + CFG.days * 864e5);
    return get("/discover/movie", {
      region: "US", language: "en-US", include_adult: "false", sort_by: "popularity.desc",
      with_release_type: "3", "release_date.gte": iso(today), "release_date.lte": iso(end), page: 1
    }).then(function (res) {
      var picks = (res.results || []).filter(function (m) { return CFG.hide.indexOf(m.id) < 0; }).slice(0, 24);
      return Promise.all(picks.map(function (m) {
        return get("/movie/" + m.id, { language: "en-US", append_to_response: "release_dates,credits" })
          .then(function (d) { return shape(d, today, end); })
          .catch(function () { return null; });
      }));
    }).then(function (list) {
      return list.filter(Boolean)
        .sort(function (a, b) { return b.pop - a.pop; }).slice(0, CFG.max)
        .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : b.pop - a.pop; });
    });
  }

  // Turn one TMDB record into what the screen needs. Returns null if the film should not show.
  function shape(d, today, end) {
    var us = ((d.release_dates && d.release_dates.results) || []).filter(function (r) { return r.iso_3166_1 === "US"; })[0];
    var rel = us ? us.release_dates : [];
    var cert = "";
    rel.forEach(function (r) { if (!cert && r.certification) cert = r.certification; });
    var wide = rel.filter(function (r) { return r.type === 3 && parseDay(r.release_date) >= today; })
      .map(function (r) { return r.release_date.slice(0, 10); }).sort()[0];
    var date = wide || d.release_date;
    if (!date) return null;
    var day = parseDay(date);
    if (day < today || day > end) return null;
    if (cert === "NC-17") return null;
    if (cert && RANK[cert] && RANK[cert] > (RANK[CFG.maxRating] || 4)) return null;
    var crew = (d.credits && d.credits.crew) || [], cast = (d.credits && d.credits.cast) || [];
    return {
      id: d.id, title: d.title, date: date, cert: RANK[cert] ? cert : "", pop: d.popularity || 0,
      overview: d.overview || "", runtime: d.runtime || 0,
      genres: (d.genres || []).slice(0, 3).map(function (g) { return g.name; }),
      poster: d.poster_path ? IMG + d.poster_path : "",
      thumb: d.poster_path ? SMALL + d.poster_path : "",
      scene: d.backdrop_path ? BIG + d.backdrop_path : "",
      director: crew.filter(function (c) { return c.job === "Director"; }).map(function (c) { return c.name; }).slice(0, 2),
      cast: cast.slice(0, 4).map(function (c) { return c.name; })
    };
  }

  function loadDemo() {
    var t = midnight(new Date());
    function d(n) { return iso(new Date(t.getTime() + n * 864e5)); }
    var text = "This is sample text so you can check the layout. Real movie descriptions load from TMDB once a key is added to the page address. Nothing here is a real film.";
    var s = [
      ["Sample Movie", 2, "PG-13", ["Action", "Adventure"], 128],
      ["A Much Longer Sample Title: The Second Chapter", 9, "PG", ["Family", "Comedy"], 104],
      ["Placeholder", 9, "R", ["Horror"], 97],
      ["Sample Three", 15, "", ["Drama"], 0],
      ["The Example Returns", 23, "PG-13", ["Science Fiction", "Action"], 141],
      ["Demo Night", 30, "G", ["Animation", "Family"], 92],
      ["Layout Test Part Two", 44, "PG-13", ["Fantasy", "Adventure"], 0],
      ["Final Sample", 58, "R", ["Thriller", "Crime"], 118]
    ];
    return Promise.resolve(s.slice(0, CFG.max).map(function (x, i) {
      return { id: i, title: x[0], date: d(x[1]), cert: x[2], genres: x[3], runtime: x[4], pop: 1,
        overview: text, poster: "", thumb: "", scene: "", director: ["Sample Director"], cast: ["Sample Actor", "Another Actor"] };
    }));
  }

  // ---------- Saved copy, so the screen survives a network hiccup ----------
  function save(list) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), films: list })); } catch (e) {} }
  function saved() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (!c || !c.films) return null;
      var today = iso(new Date());
      c.films = c.films.filter(function (f) { return f.date >= today; });
      return c.films.length ? c : null;
    } catch (e) { return null; }
  }

  // ---------- Drawing ----------
  function countdown(date) {
    var n = Math.round((parseDay(date) - midnight(new Date())) / 864e5);
    return n <= 0 ? "Opens today" : n === 1 ? "Opens tomorrow" : "Opens in " + n + " days";
  }
  function hours(min) { return min ? Math.floor(min / 60) + " hr " + (min % 60) + " min" : ""; }
  function short(text) {
    var parts = text.match(/[^.!?]+[.!?]+(\s|$)/g);
    return parts ? parts.slice(0, 2).join("").trim() : text;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

  function fitTitle() {
    var el = $("title"), r = rem(), size = 24;
    el.style.fontSize = size + "rem";
    while (size > 10 && (el.scrollHeight > 38 * r || el.scrollWidth > el.clientWidth + 1)) {
      size -= 1; el.style.fontSize = size + "rem";
    }
  }

  function daysOut(date) { return Math.round((parseDay(date) - midnight(new Date())) / 864e5); }
  function setScene(f) {
    var sc = $("scene"), old = sc.querySelector("img.on");
    if (!f.scene) { if (old) old.classList.remove("on"); return; }
    if (old && old.dataset.src === f.scene) return;
    var img = new Image(); img.alt = ""; img.dataset.src = f.scene;
    img.onload = function () {
      requestAnimationFrame(function () { img.classList.add("on"); if (old) old.classList.remove("on"); });
      setTimeout(function () { [].slice.call(sc.querySelectorAll("img:not(.on)")).forEach(function (x) { if (x !== img) x.remove(); }); }, 1200);
    };
    img.src = f.scene; sc.appendChild(img);
  }
  function drawFeature(f) {
    var day = parseDay(f.date), p = $("poster"), n = daysOut(f.date);
    setScene(f);
    p.textContent = "";
    if (f.poster) {
      var img = new Image();
      img.alt = "Poster for " + f.title;
      img.onerror = function () { p.textContent = ""; p.appendChild(noArt(f.title)); };
      img.src = f.poster;
      p.appendChild(img);
    } else p.appendChild(noArt(f.title));
    var lead = $("lead"), big = $("big");
    if (n <= 0) { lead.textContent = "In theaters"; big.textContent = "Today"; }
    else if (n === 1) { lead.textContent = "Out"; big.textContent = "Tomorrow"; }
    else if (n <= 6) { lead.textContent = "Out this"; big.textContent = fmt(day, { weekday: "long" }); }
    else { lead.textContent = "Out in"; big.innerHTML = n + "<small>days</small>"; }
    $("date").textContent = fmt(day, { weekday: "long", month: "long", day: "numeric" });
    var r = $("rating");
    r.textContent = f.cert || "Not rated yet";
    r.className = "disp rating" + (f.cert === "R" ? " r" : "") + (f.cert ? "" : " nr");
    $("genres").textContent = f.genres.join(", ");
    $("runtime").textContent = hours(f.runtime);
    $("title").textContent = f.title;
    fitTitle(); fitBig();
  }
  function fitBig() {
    var el = $("big"), size = 36;
    el.style.fontSize = size + "rem";
    while (size > 12 && el.scrollWidth > el.clientWidth + 1) { size -= 1; el.style.fontSize = size + "rem"; }
  }
  function noArt(title) {
    var s = document.createElement("span");
    s.className = "disp noart"; s.textContent = title; return s;
  }

  function drawRows() {
    var box = $("rows"); box.textContent = "";
    films.forEach(function (f, i) {
      var b = document.createElement("button");
      b.className = "pick"; b.type = "button";
      b.setAttribute("aria-label", "Show " + f.title);
      var art = document.createElement("span"); art.className = "art";
      if (f.thumb) { var im = new Image(); im.alt = ""; im.src = f.thumb; art.appendChild(im); }
      else art.appendChild(noArt(f.title));
      var d = document.createElement("span"); d.className = "d";
      d.textContent = fmt(parseDay(f.date), { month: "short", day: "numeric" });
      b.appendChild(art); b.appendChild(d); b.appendChild(document.createElement("i"));
      b.addEventListener("click", function () { hold(); show(i, true); });
      box.appendChild(b);
    });
  }

  function show(i, instant) {
    index = (i + films.length) % films.length;
    var feat = $("feature"), rows = $("rows").children;
    var still = instant || matchMedia("(prefers-reduced-motion: reduce)").matches;
    function paint() {
      drawFeature(films[index]);
      feat.classList.remove("swap");
      for (var k = 0; k < rows.length; k++) {
        var on = k === index, bar = rows[k].lastElementChild;
        rows[k].setAttribute("aria-current", on ? "true" : "false");
        bar.classList.remove("run");
        if (on && films.length > 1 && Date.now() >= pausedUntil) {
          void bar.offsetWidth; bar.classList.add("run");
        }
      }
    }
    if (still) paint(); else { feat.classList.add("swap"); setTimeout(paint, 360); }
  }

  function hold() { pausedUntil = Date.now() + PAUSE_MS; }
  function tick() {
    if (Date.now() < pausedUntil || $("sheet").open || films.length < 2) return;
    show(index + 1);
  }

  function start(list, stampText) {
    films = list;
    $("note").hidden = true;
    $("feature").hidden = false; $("board").hidden = false;
    $("stamp").textContent = stampText;
    drawRows(); show(0, true);
    clearInterval(timer); timer = setInterval(tick, CFG.rotate * 1000);
  }

  function note(head, html) {
    $("feature").hidden = true; $("board").hidden = true;
    var n = $("note"); n.hidden = false;
    n.innerHTML = '<h2 class="disp"></h2>' + html;
    n.firstChild.textContent = head;
  }

  // ---------- Detail sheet ----------
  function openSheet() {
    var f = films[index]; if (!f) return;
    hold();
    $("s-title").textContent = f.title;
    $("s-line").textContent = [fmt(parseDay(f.date), { weekday: "long", month: "long", day: "numeric" }),
      f.cert ? "Rated " + f.cert : "Not yet rated", hours(f.runtime), f.genres.join(", ")].filter(Boolean).join("  /  ");
    $("s-full").textContent = f.overview || "No description yet.";
    var dl = $("s-people"); dl.textContent = "";
    [["Directed by", f.director], ["Starring", f.cast]].forEach(function (p) {
      if (!p[1].length) return;
      var dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = p[0]; dd.textContent = p[1].join(", ");
      dl.appendChild(dt); dl.appendChild(dd);
    });
    $("sheet").showModal();
    clearTimeout(sheetTimer); sheetTimer = setTimeout(closeSheet, PAUSE_MS);
  }
  function closeSheet() { clearTimeout(sheetTimer); if ($("sheet").open) $("sheet").close(); hold(); show(index, true); }
  $("feature").addEventListener("click", openSheet);
  $("s-close").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  window.addEventListener("resize", function () { if (films.length) { fitTitle(); fitBig(); } });

  // ---------- Go ----------
  function refresh() {
    if (CFG.demo) return loadDemo().then(function (l) { start(l, "Sample layout, not real films"); });
    if (!CFG.key) {
      return note("Add a TMDB key", "<p>This screen needs a free key from themoviedb.org to load movies.</p>" +
        "<p>Add it to the end of the page address like this: <code>?key=YOUR_KEY</code></p>" +
        "<p>To see the layout with made-up titles, use <code>?demo=1</code></p>");
    }
    return loadLive().then(function (list) {
      if (!list.length) throw new Error("empty");
      save(list);
      start(list, "Updated " + new Date().toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
    }).catch(function (err) {
      var c = saved();
      if (c) return start(c.films, "Showing the list saved " + new Date(c.t).toLocaleDateString("en-US", { month: "short", day: "numeric" }));
      if (films.length) return;
      if (err && err.status === 401) return note("Key not accepted", "<p>TMDB turned down the key in the page address. Check it for typos and reload.</p>");
      if (err && err.message === "empty") return note("Nothing listed", "<p>TMDB has no upcoming films that match the settings. Try a longer window with <code>&amp;days=120</code></p>");
      note("Can't reach the movie list", "<p>The screen could not load from TMDB. Ask for these two sites to be allowed on the network filter, then reload:</p>" +
        "<p><code>api.themoviedb.org</code> and <code>image.tmdb.org</code></p>");
    });
  }
  function boot() { refresh(); setInterval(refresh, REFRESH_MS); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
})();
</script>
</body>
</html>
